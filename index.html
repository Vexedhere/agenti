<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SparkAgent — Agent Workspace</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,sans-serif;background:#07070c;color:#f5f7fb;overflow:hidden}.mesh{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 10%,rgba(124,58,237,.22),transparent 32%),radial-gradient(circle at 88% 85%,rgba(6,182,212,.16),transparent 30%),linear-gradient(120deg,#07070c,#0b0912 48%,#070a10)}.grid{position:fixed;inset:0;opacity:.13;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:44px 44px}.glass{background:rgba(13,13,22,.72);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);box-shadow:0 24px 80px rgba(0,0,0,.35)}.agent{transition:.2s}.agent:hover{transform:translateY(-2px);border-color:#a78bfa66}.agent.active{border-color:#a78bfa99;background:linear-gradient(135deg,#7c3aed2e,#06b6d412)}.scroll::-webkit-scrollbar{width:5px}.scroll::-webkit-scrollbar-thumb{background:#ffffff18;border-radius:20px}.bubble{max-width:82%;border:1px solid rgba(255,255,255,.07)}.user{background:linear-gradient(135deg,#7c3aed,#4f46e5)}.ai{background:rgba(255,255,255,.045)}.send{background:linear-gradient(135deg,#8b5cf6,#06b6d4)}.orb{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-6px) scale(1.02)}}.typing span{display:inline-block;width:5px;height:5px;background:#a78bfa;border-radius:50%;margin:0 2px;animation:p 1s infinite}@keyframes p{50%{opacity:.3;transform:translateY(-3px)}}pre{background:#050509!important;padding:14px;border-radius:14px;overflow:auto}code{font-family:'JetBrains Mono',monospace}a{color:#67e8f9}</style></head>
<body><div class="mesh"></div><div class="grid"></div><div class="relative z-10 h-screen flex">
<aside class="glass w-[285px] shrink-0 flex flex-col p-4"><div class="flex items-center gap-3 px-2 py-2 mb-5"><div class="orb w-11 h-11 rounded-2xl flex items-center justify-center bg-gradient-to-br from-violet-500 to-cyan-400 shadow-lg shadow-violet-500/20 font-black">S</div><div><div class="font-extrabold tracking-tight">SparkAgent</div><div class="text-[10px] text-violet-300 uppercase tracking-[.2em]">Agent workspace</div></div></div><button onclick="newChat()" class="w-full rounded-2xl py-3 bg-white/[.06] border border-white/10 hover:bg-white/[.1] font-semibold text-sm">＋ New session</button><div class="mt-6 mb-2 px-2 text-[10px] uppercase tracking-[.2em] text-gray-500">Agents</div><div id="agents" class="space-y-2 overflow-y-auto scroll pr-1"></div><div class="mt-auto pt-4 border-t border-white/10"><div class="flex items-center justify-between px-2"><div><div class="text-xs font-semibold">Spark runtime</div><div id="runtime" class="text-[10px] text-gray-500">Ready • tools online</div></div><span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span></div><button onclick="location.href='https://download.sparkagent.in.net'" class="mt-3 w-full py-2.5 rounded-xl bg-gradient-to-r from-violet-500/15 to-cyan-400/10 border border-white/10 text-xs text-gray-200">↓ Download SparkAgent</button><button onclick="location.href='https://try.sparkagent.in.net'" class="mt-2 w-full py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-xs text-gray-400">← Account / Login</button></div></aside>
<main class="flex-1 min-w-0 flex flex-col"><header class="h-[76px] shrink-0 border-b border-white/10 flex items-center justify-between px-7 bg-black/10 backdrop-blur-xl"><div><div class="text-xs text-gray-500">ACTIVE AGENT</div><div id="activeName" class="font-bold text-lg">Spark Core</div></div><div class="flex items-center gap-3"><div class="hidden md:flex items-center gap-2 px-3 py-2 rounded-xl bg-white/[.04] border border-white/10 text-xs text-gray-400"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> Online</div><button onclick="clearChat()" class="px-3 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-xs text-gray-400">Clear</button></div></header><section id="chat" class="flex-1 overflow-y-auto scroll px-5 md:px-10 py-8"><div id="empty" class="max-w-4xl mx-auto min-h-full flex items-center justify-center"><div class="text-center max-w-2xl"><div class="mx-auto w-20 h-20 rounded-3xl bg-gradient-to-br from-violet-500/20 to-cyan-400/10 border border-violet-400/20 flex items-center justify-center text-3xl mb-6 orb">✦</div><h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">What are we building?</h1><p class="text-gray-400 mt-4">Talk to your agent. Build apps, write code, research ideas, automate tasks and turn instructions into work.</p><div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-8 text-left"><button onclick="quick('Build a polished landing page for my project')" class="glass rounded-2xl p-4 hover:bg-white/[.07]"><b class="text-sm">Build UI</b><div class="text-xs text-gray-500 mt-1">Design a clean product interface</div></button><button onclick="quick('Review this code and find the bugs')" class="glass rounded-2xl p-4 hover:bg-white/[.07]"><b class="text-sm">Review code</b><div class="text-xs text-gray-500 mt-1">Debug and improve implementation</div></button><button onclick="quick('Create a launch plan and task list')" class="glass rounded-2xl p-4 hover:bg-white/[.07]"><b class="text-sm">Plan & execute</b><div class="text-xs text-gray-500 mt-1">Break work into actionable steps</div></button></div></div></div><div id="messages" class="max-w-4xl mx-auto space-y-5"></div></section><footer class="shrink-0 p-5 md:p-7"><div class="max-w-4xl mx-auto"><div class="glass rounded-3xl p-2 flex items-end gap-2"><textarea id="input" rows="1" onkeydown="key(event)" placeholder="Talk to SparkAgent…" class="flex-1 resize-none bg-transparent outline-none px-4 py-3 text-sm text-white placeholder:text-gray-600 max-h-40"></textarea><button onclick="send()" class="send w-12 h-12 shrink-0 rounded-2xl flex items-center justify-center text-white shadow-lg">➤</button></div><div class="flex items-center justify-between mt-2 px-2 text-[10px] text-gray-600"><span>Enter to send • Shift+Enter for newline</span><span id="modelLabel">Model: openrouter/free</span></div></div></footer></main></div>
<script>
const AI_API_KEY='CHANGE_ME_LATER';
const AI_BASE_URL='https://openrouter.ai/api/v1/chat/completions';
const agents=[{id:'core',icon:'✦',name:'Spark Core',desc:'General AI + task execution',model:'openrouter/free',system:'You are Spark Core, the primary SparkAgent. Help the user plan and execute tasks clearly. You can assist with coding, writing, research, project planning and automation. Be proactive and practical. Never claim to have performed an external action unless the connected tool actually did it.'},{id:'code',icon:'⌘',name:'CodeForge',desc:'Coding, debugging & repos',model:'openrouter/free',system:'You are CodeForge, an expert software engineer. Produce practical production-minded code, debug carefully, inspect requirements and give exact implementation steps.'},{id:'builder',icon:'◆',name:'Builder',desc:'Apps, UI & products',model:'openrouter/free',system:'You are Builder, a senior product and frontend engineering agent. Design polished interfaces and turn product requirements into complete implementation plans and code.'},{id:'research',icon:'◎',name:'Research',desc:'Research, analysis & planning',model:'openrouter/free',system:'You are Research, an analytical agent. Structure assumptions, evidence, tradeoffs and conclusions. Do not claim live web research unless live browsing is actually available.'},{id:'creative',icon:'✧',name:'Creative',desc:'Writing, branding & ideas',model:'openrouter/free',system:'You are Creative, a high-quality creative agent for branding, copy, concepts, scripts, names and storytelling.'}];
let active=agents[0],messages=[];
function renderAgents(){agentsEl.innerHTML=agents.map(a=>`<button onclick="selectAgent('${a.id}')" class="agent ${a.id===active.id?'active':''} w-full text-left rounded-2xl border border-white/7 p-3 flex items-center gap-3"><span class="w-9 h-9 rounded-xl bg-white/5 flex items-center justify-center text-lg">${a.icon}</span><span class="min-w-0"><span class="block text-sm font-semibold truncate">${a.name}</span><span class="block text-[10px] text-gray-500 truncate">${a.desc}</span></span></button>`).join('');activeName.textContent=active.name;modelLabel.textContent='Model: '+active.model}
const agentsEl=document.getElementById('agents');renderAgents();
function selectAgent(id){active=agents.find(a=>a.id===id)||active;renderAgents();if(messages.length)addMessage('system',`Switched to **${active.name}** — ${active.desc}.`)}
function newChat(){messages=[];document.getElementById('messages').innerHTML='';empty.style.display='flex';input.focus()}function clearChat(){newChat()}function quick(t){input.value=t;send()}function key(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function addMessage(role,text){empty.style.display='none';const wrap=document.createElement('div');wrap.className='flex '+(role==='user'?'justify-end':'justify-start');const bubble=document.createElement('div');bubble.className='bubble rounded-3xl px-5 py-4 '+(role==='user'?'user':'ai');if(role==='system')bubble.className+=' text-violet-300 text-xs';bubble.innerHTML=role==='user'?escapeHtml(text):marked.parse(text);wrap.appendChild(bubble);messagesEl.appendChild(wrap);chat.scrollTop=chat.scrollHeight;return bubble}
const chat=document.getElementById('chat'),messagesEl=document.getElementById('messages'),empty=document.getElementById('empty'),input=document.getElementById('input'),activeName=document.getElementById('activeName'),modelLabel=document.getElementById('modelLabel');
function escapeHtml(s){return s.replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
async function send(){const text=input.value.trim();if(!text)return;input.value='';messages.push({role:'user',content:text});addMessage('user',text);const bubble=addMessage('assistant','<div class="typing"><span></span><span></span><span></span></div>');runtime.textContent='Working • agent is thinking…';try{if(AI_API_KEY==='CHANGE_ME_LATER'){await new Promise(r=>setTimeout(r,500));bubble.innerHTML=marked.parse(`**${active.name} received your task.**\n\nThe agent workspace is connected and ready. Add your provider API key in the configuration to enable live model responses.\n\n**Task:** ${text}`);return}const r=await fetch(AI_BASE_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+AI_API_KEY,'HTTP-Referer':location.origin,'X-Title':'SparkAgent'},body:JSON.stringify({model:active.model,messages:[{role:'system',content:active.system},...messages]})});if(!r.ok)throw new Error('API '+r.status);const d=await r.json();const answer=d.choices?.[0]?.message?.content||'No response received.';messages.push({role:'assistant',content:answer});bubble.innerHTML=marked.parse(answer)}catch(e){bubble.innerHTML=marked.parse('⚠️ **Agent connection failed.**\n\n'+e.message+'\n\nCheck your API key, endpoint and model.')}finally{runtime.textContent='Ready • tools online'}}
const runtime=document.getElementById('runtime');
</script></body></html>
