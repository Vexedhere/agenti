<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SparkAgent</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,sans-serif;background:#08080d;color:#f7f7fb;overflow:hidden}.mesh{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 10%,#7c3aed2b,transparent 30%),radial-gradient(circle at 90% 90%,#06b6d41c,transparent 32%),#08080d}.grid{position:fixed;inset:0;pointer-events:none;opacity:.045;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:42px 42px}.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:#ffffff18;border-radius:20px}.bubble{max-width:min(850px,88%);line-height:1.72}.user{background:linear-gradient(135deg,#7c3aed,#4f46e5)}.ai{background:#ffffff07;border:1px solid #ffffff0c}.glass{background:#0d0d14dd;backdrop-filter:blur(24px);border:1px solid #ffffff0b}.send{background:linear-gradient(135deg,#8b5cf6,#06b6d4)}.typing span{display:inline-block;width:6px;height:6px;background:#a78bfa;border-radius:50%;margin:0 2px;animation:p 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes p{50%{opacity:.2;transform:translateY(-3px)}}pre{background:#050509!important;padding:16px;border-radius:16px;overflow:auto;border:1px solid #ffffff0b}code{font-family:'JetBrains Mono',monospace}.code-wrap{position:relative;margin:1rem 0}.code-wrap pre{margin:0;padding-top:42px}.code-lang{position:absolute;left:14px;top:11px;color:#9ca3af;font:11px 'JetBrains Mono',monospace;text-transform:uppercase}.copy-code{position:absolute;right:10px;top:8px;border:1px solid #ffffff14;background:#ffffff0a;color:#d1d5db;border-radius:9px;padding:5px 9px;font-size:11px;cursor:pointer;z-index:2}.recent-item{transition:.15s}.recent-item:hover{background:#ffffff08}.recent-item.active{background:#ffffff0b}.tier-free{color:#c4b5fd;background:#8b5cf615;border-color:#8b5cf630}.tier-plus{color:#67e8f9;background:#06b6d415;border-color:#06b6d430}.tier-pro{color:#f0abfc;background:#d946ef15;border-color:#d946ef30}.tier-premium{color:#fde68a;background:#f59e0b15;border-color:#f59e0b30}@media(max-width:767px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;width:290px;transform:translateX(-105%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.backdrop{display:none;position:fixed;inset:0;z-index:40;background:#0009}.backdrop.open{display:block}.mobile-menu{display:flex}.bubble{max-width:94%}}@media(min-width:768px){.mobile-menu{display:none}}
</style>
</head>
<body>
<div class="mesh"></div><div class="grid"></div><div id="backdrop" class="backdrop" onclick="closeSidebar()"></div>
<div class="relative z-10 h-screen flex">
<aside id="sidebar" class="sidebar glass w-[290px] shrink-0 flex flex-col">
  <div class="p-3">
    <div class="flex items-center gap-2">
      <button onclick="newChat()" class="flex-1 flex items-center gap-3 rounded-xl px-3 py-2.5 hover:bg-white/[.06] text-sm font-semibold"><span class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-500 to-cyan-400 flex items-center justify-center font-black">S</span><span>SparkAgent</span></button>
      <button onclick="closeSidebar()" class="mobile-menu w-9 h-9 items-center justify-center rounded-lg bg-white/5">×</button>
    </div>
    <button onclick="newChat();closeSidebar()" class="mt-3 w-full flex items-center gap-3 rounded-xl px-3 py-2.5 bg-white/[.06] hover:bg-white/[.1] text-sm"><span class="text-lg">＋</span> New chat</button>
  </div>
  <div class="px-3 pt-3 flex-1 min-h-0 flex flex-col">
    <div class="px-2 pb-2 text-[10px] uppercase tracking-[.2em] text-gray-500">Recent chats</div>
    <div id="recentChats" class="flex-1 overflow-y-auto scroll space-y-1 pr-1"></div>
  </div>
  <div class="p-3 border-t border-white/10">
    <div class="flex items-center gap-3 rounded-xl px-2 py-2">
      <div id="avatar" class="w-9 h-9 rounded-full bg-gradient-to-br from-violet-500 to-cyan-400 flex items-center justify-center font-bold text-sm">S</div>
      <div class="min-w-0 flex-1"><div id="userName" class="text-sm font-semibold truncate">SparkAgent user</div><div id="userEmail" class="text-[10px] text-gray-500 truncate">Not signed in</div></div>
      <span id="tierBadge" class="tier-free border rounded-full px-2 py-1 text-[9px] font-bold uppercase">FREE</span>
    </div>
  </div>
</aside>
<main class="flex-1 min-w-0 flex flex-col">
  <header class="h-[64px] shrink-0 border-b border-white/10 flex items-center justify-between px-3 md:px-6 bg-black/20 backdrop-blur-xl">
    <div class="flex items-center gap-2"><button onclick="openSidebar()" class="mobile-menu w-9 h-9 items-center justify-center rounded-lg bg-white/5">☰</button><button onclick="newChat()" class="hidden md:flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-white/5 text-sm text-gray-300">＋ New chat</button></div>
    <div class="flex items-center gap-2"><span id="headerTier" class="tier-free border rounded-full px-2.5 py-1 text-[10px] font-bold uppercase">FREE</span><button onclick="location.href='https://try.sparkagent.in.net'" class="px-3 py-2 rounded-lg hover:bg-white/5 text-xs text-gray-400">Account</button></div>
  </header>
  <section id="chat" class="flex-1 overflow-y-auto scroll px-3 md:px-8 py-7">
    <div id="empty" class="max-w-3xl mx-auto min-h-full flex items-center justify-center">
      <div class="w-full text-center pb-20">
        <div class="mx-auto w-16 h-16 rounded-2xl bg-gradient-to-br from-violet-500/20 to-cyan-400/10 border border-violet-400/20 flex items-center justify-center text-3xl mb-6">✦</div>
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight">How can I help you?</h1>
        <p class="text-gray-500 mt-3">Ask SparkAgent anything. Code, explain, write, plan, brainstorm and more.</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-8 text-left">
          <button onclick="quick('Explain this concept to me simply')" class="rounded-2xl border border-white/10 bg-white/[.03] hover:bg-white/[.07] p-4"><b class="text-sm">Explain something</b><div class="text-xs text-gray-500 mt-1">Learn a topic step by step</div></button>
          <button onclick="quick('Help me write and improve this')" class="rounded-2xl border border-white/10 bg-white/[.03] hover:bg-white/[.07] p-4"><b class="text-sm">Write something</b><div class="text-xs text-gray-500 mt-1">Draft, rewrite or polish text</div></button>
          <button onclick="quick('Help me debug this code')" class="rounded-2xl border border-white/10 bg-white/[.03] hover:bg-white/[.07] p-4"><b class="text-sm">Code with me</b><div class="text-xs text-gray-500 mt-1">Debug, build and understand code</div></button>
          <button onclick="quick('Help me make a plan for my project')" class="rounded-2xl border border-white/10 bg-white/[.03] hover:bg-white/[.07] p-4"><b class="text-sm">Plan a project</b><div class="text-xs text-gray-500 mt-1">Turn an idea into clear steps</div></button>
        </div>
      </div>
    </div>
    <div id="messages" class="max-w-3xl mx-auto space-y-7"></div>
  </section>
  <footer class="shrink-0 px-3 md:px-8 pb-4 md:pb-6">
    <div class="max-w-3xl mx-auto">
      <div class="glass rounded-[24px] p-2 flex items-end gap-2 shadow-2xl">
        <textarea id="input" rows="1" onkeydown="key(event)" oninput="resizeInput()" placeholder="Message SparkAgent…" class="flex-1 resize-none bg-transparent outline-none px-3 py-3 text-sm max-h-40"></textarea>
        <button id="sendButton" onclick="send()" class="send w-11 h-11 shrink-0 rounded-2xl flex items-center justify-center font-bold">➤</button>
      </div>
      <div class="text-center text-[10px] text-gray-600 mt-2">SparkAgent can make mistakes. Check important information.</div>
    </div>
  </footer>
</main></div>
<script>
const BASE='/api/chat';
const MODEL='openrouter/free';
const SUPABASE_URL='https://nzaelikbjumaidaombmp.supabase.co';
const SUPABASE_KEY='sb_publishable_xI4i15jxoh44D8USeKLLKQ_daeg0gtt';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let messages=[];let streaming=false;let currentChatId=null;let currentUser=null;let currentTier='FREE';
const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function markdown(text){const raw=marked.parse(text||'');const safe=DOMPurify.sanitize(raw,{USE_PROFILES:{html:true},ADD_ATTR:['target','rel']});const t=document.createElement('div');t.innerHTML=safe;t.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});t.querySelectorAll('pre code').forEach(code=>{try{hljs.highlightElement(code)}catch(_){}});return t.innerHTML}
function addMessage(role,text){$('empty').style.display='none';const row=document.createElement('div');row.className='flex '+(role==='user'?'justify-end':'justify-start');const b=document.createElement('div');b.className='bubble rounded-3xl px-5 py-4 '+(role==='user'?'user':'ai');b.innerHTML=role==='user'?esc(text):markdown(text);row.appendChild(b);$('messages').appendChild(row);scrollChat();return b}
function scrollChat(){$('chat').scrollTop=$('chat').scrollHeight}
function resizeInput(){const e=$('input');e.style.height='auto';e.style.height=Math.min(e.scrollHeight,160)+'px'}
function key(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function quick(t){$('input').value=t;resizeInput();send()}
function openSidebar(){$('sidebar').classList.add('open');$('backdrop').classList.add('open')}
function closeSidebar(){$('sidebar').classList.remove('open');$('backdrop').classList.remove('open')}
function tierClass(t){return 'tier-'+String(t||'FREE').toLowerCase()}
function setTier(tier){currentTier=(tier||'FREE').toUpperCase();$('tierBadge').textContent=currentTier;$('headerTier').textContent=currentTier;$('tierBadge').className=tierClass(currentTier)+' border rounded-full px-2 py-1 text-[9px] font-bold uppercase';$('headerTier').className=tierClass(currentTier)+' border rounded-full px-2.5 py-1 text-[10px] font-bold uppercase'}
async function restoreSessionFromHandoff(){try{if(!location.hash)return false;const hash=location.hash.startsWith('#')?location.hash.slice(1):location.hash;const params=new URLSearchParams(hash);const access_token=params.get('access_token');const refresh_token=params.get('refresh_token');if(!access_token||!refresh_token)return false;const {error}=await sb.auth.setSession({access_token,refresh_token});history.replaceState(null,document.title,location.pathname+location.search);if(error){console.warn('Session handoff failed',error);return false}return true}catch(e){console.warn('Session handoff unavailable',e);return false}}
async function loadUser(){try{const {data:{session}}=await sb.auth.getSession();currentUser=session?.user||null;if(!currentUser){$('userName').textContent='Guest';$('userEmail').textContent='Sign in to SparkAgent';setTier('FREE');return}const meta=currentUser.user_metadata||{};$('userName').textContent=meta.display_name||meta.full_name||currentUser.email?.split('@')[0]||'SparkAgent user';$('userEmail').textContent=currentUser.email||'';$('avatar').textContent=(($('userName').textContent||'S')[0]).toUpperCase();let {data:profile}=await sb.from('profiles').select('tier,display_name').eq('id',currentUser.id).maybeSingle();if(profile?.display_name)$('userName').textContent=profile.display_name;setTier(profile?.tier||'FREE');await recordLogin()}catch(e){console.warn('Account data unavailable',e);setTier('FREE')}}
async function recordLogin(){if(!currentUser)return;const key='sparkagent_login_'+currentUser.id;const today=new Date().toISOString().slice(0,10);if(localStorage.getItem(key)===today)return;try{await sb.from('profiles').update({last_login_at:new Date().toISOString()}).eq('id',currentUser.id);await sb.from('login_activity').insert({user_id:currentUser.id,user_agent:navigator.userAgent});localStorage.setItem(key,today)}catch(e){console.warn('Login activity unavailable',e)}}
function chatKey(){return currentUser?'sparkagent_chats_'+currentUser.id:'sparkagent_guest_chats'}
function getChats(){try{return JSON.parse(localStorage.getItem(chatKey())||'[]')}catch{return[]}}
function saveChats(list){localStorage.setItem(chatKey(),JSON.stringify(list.slice(0,50)))}
function titleFor(){const first=messages.find(m=>m.role==='user');return first?first.content.slice(0,48)+(first.content.length>48?'…':''):'New chat'}
function persistChat(){if(!messages.length)return;let list=getChats();const id=currentChatId||crypto.randomUUID();currentChatId=id;const existing=list.find(c=>c.id===id);const item={id,title:titleFor(),messages,updatedAt:Date.now()};if(existing)Object.assign(existing,item);else list.unshift(item);list.sort((a,b)=>b.updatedAt-a.updatedAt);saveChats(list);renderRecent()}
function renderRecent(){const list=getChats();$('recentChats').innerHTML=list.length?list.map(c=>`<button onclick="openChat('${c.id}');closeSidebar()" class="recent-item ${c.id===currentChatId?'active':''} w-full text-left rounded-lg px-3 py-2.5 text-xs text-gray-300 truncate">${esc(c.title)}</button>`).join(''):'<div class="px-3 py-5 text-xs text-gray-600">Your recent chats will appear here.</div>'}
function openChat(id){const c=getChats().find(x=>x.id===id);if(!c)return;currentChatId=id;messages=Array.isArray(c.messages)?c.messages:[];$('messages').innerHTML='';$('empty').style.display=messages.length?'none':'flex';messages.forEach(m=>addMessage(m.role,m.content));renderRecent()}
function newChat(){currentChatId=null;messages=[];$('messages').innerHTML='';$('empty').style.display='flex';renderRecent();$('input').focus()}
function clearCurrent(){newChat()}
async function send(){if(streaming)return;const text=$('input').value.trim();if(!text)return;$('input').value='';resizeInput();messages.push({role:'user',content:text});addMessage('user',text);const b=addMessage('assistant','<div class="typing"><span></span><span></span><span></span></div>');$('sendButton').disabled=true;streaming=true;let answer='';try{const system='You are SparkAgent, a helpful AI assistant. You are currently serving a '+currentTier+' tier user. Be useful, clear and proactive. For complex requests, reason through the task and provide concrete results. Never claim that you used tools, changed files, sent messages, or performed external actions unless the connected system actually did so.';const response=await fetch(BASE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,messages:[{role:'system',content:system},...messages]})});if(!response.ok){let msg='Server error '+response.status;try{const d=await response.json();msg=d.error||d.message||msg}catch(_){}throw new Error(msg)}if(!response.body)throw new Error('Streaming is not supported by this browser.');const reader=response.body.getReader();const decoder=new TextDecoder();let buffer='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split(/\r?\n/);buffer=lines.pop()||'';for(const line of lines){const s=line.trim();if(!s.startsWith('data:'))continue;const payload=s.slice(5).trim();if(!payload||payload==='[DONE]')continue;try{const chunk=JSON.parse(payload);const delta=chunk?.choices?.[0]?.delta?.content||'';if(delta){answer+=delta;updateBubble(b,answer)}}catch(_){} }}if(!answer)answer='I did not receive a response. Please try again.';messages.push({role:'assistant',content:answer});persistChat()}catch(e){b.innerHTML=markdown('**SparkAgent error:** '+e.message);messages.push({role:'assistant',content:'**SparkAgent error:** '+e.message});persistChat()}finally{streaming=false;$('sendButton').disabled=false}}
function updateBubble(b,text){b.innerHTML=markdown(text);scrollChat()}
sb.auth.onAuthStateChange(()=>setTimeout(loadUser,0));
(async()=>{await restoreSessionFromHandoff();await loadUser();renderRecent()})();
</script>
</body>
</html>
