<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SparkAgent — Agent Workspace</title>
<meta name="theme-color" content="#07070c">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,sans-serif;background:#07070c;color:#f5f7fb;overflow:hidden}.mesh{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 10%,rgba(124,58,237,.22),transparent 32%),radial-gradient(circle at 88% 85%,rgba(6,182,212,.16),transparent 30%),linear-gradient(120deg,#07070c,#0b0912 48%,#070a10)}.gridbg{position:fixed;inset:0;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 90%)}.glass{background:rgba(13,13,22,.72);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);box-shadow:0 24px 80px rgba(0,0,0,.35)}.agent{transition:.2s}.agent:hover{transform:translateY(-2px);border-color:rgba(167,139,250,.45);background:rgba(124,58,237,.11)}.agent.active{border-color:rgba(167,139,250,.7);background:linear-gradient(135deg,rgba(124,58,237,.18),rgba(6,182,212,.07));box-shadow:0 0 35px rgba(124,58,237,.12)}.scroll::-webkit-scrollbar{width:5px}.scroll::-webkit-scrollbar-thumb{background:#ffffff18;border-radius:20px}.bubble{max-width:78%;border:1px solid rgba(255,255,255,.07)}.user{background:linear-gradient(135deg,#7c3aed,#4f46e5)}.ai{background:rgba(255,255,255,.045)}.mono{font-family:'JetBrains Mono',monospace}.send{background:linear-gradient(135deg,#8b5cf6,#06b6d4)}.orb{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-6px) scale(1.02)}}@keyframes pulse{50%{opacity:.45;transform:scale(1.08)}}.pulse{animation:pulse 2s infinite}.typing span{display:inline-block;width:5px;height:5px;background:#a78bfa;border-radius:50%;margin:0 2px;animation:pulse 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
</style>
</head>
<body>
<div class="mesh"></div><div class="gridbg"></div>
<div class="relative z-10 h-screen flex">
<aside class="glass w-[285px] shrink-0 border-y-0 border-l-0 flex flex-col p-4">
  <div class="flex items-center gap-3 px-2 py-2 mb-5"><div class="orb w-11 h-11 rounded-2xl flex items-center justify-center bg-gradient-to-br from-violet-500 to-cyan-400 shadow-lg shadow-violet-500/20"><span class="font-black text-lg">S</span></div><div><div class="font-extrabold tracking-tight">SparkAgent</div><div class="text-[10px] text-violet-300 uppercase tracking-[.2em]">Agent workspace</div></div></div>
  <button onclick="newChat()" class="w-full rounded-2xl py-3 bg-white/[.06] border border-white/10 hover:bg-white/[.1] font-semibold text-sm">＋ New session</button>
  <div class="mt-6 mb-2 px-2 text-[10px] uppercase tracking-[.2em] text-gray-500">Agents</div>
  <div id="agents" class="space-y-2 overflow-y-auto scroll pr-1"></div>
  <div class="mt-auto pt-4 border-t border-white/10"><div class="flex items-center justify-between px-2"><div><div class="text-xs font-semibold">Spark runtime</div><div class="text-[10px] text-gray-500">Ready • client tools online</div></div><span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_12px_#34d399]"></span></div><button onclick="window.location.href='https://try.sparkagent.in.net'" class="mt-3 w-full py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-xs text-gray-300">← Account / Login</button></div>
</aside>
<main class="flex-1 min-w-0 flex flex-col">
<header class="h-[76px] shrink-0 border-b border-white/10 flex items-center justify-between px-7 bg-black/10 backdrop-blur-xl"><div><div class="text-xs text-gray-500">ACTIVE AGENT</div><div id="activeName" class="font-bold text-lg">Spark Core</div></div><div class="flex items-center gap-3"><div class="hidden md:flex items-center gap-2 px-3 py-2 rounded-xl bg-white/[.04] border border-white/10 text-xs text-gray-400"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> Online</div><button onclick="clearChat()" class="px-3 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-xs text-gray-400">Clear</button></div></header>
<section id="chat" class="flex-1 overflow-y-auto scroll px-5 md:px-10 py-8"><div id="empty" class="max-w-4xl mx-auto min-h-full flex items-center justify-center"><div class="text-center max-w-2xl"><div class="mx-auto w-20 h-20 rounded-3xl bg-gradient-to-br from-violet-500/20 to-cyan-400/10 border border-violet-400/20 flex items-center justify-center text-3xl mb-6 orb">✦</div><h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">What are we building?</h1><p class="text-gray-400 mt-4">Pick an agent and give SparkAgent a task. Switch agents anytime without leaving your workspace.</p><div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-8 text-left"><button onclick="quick('Build a polished landing page for my project')" class="glass rounded-2xl p-4 hover:bg-white/[.07]"><b class="text-sm">Build UI</b><div class="text-xs text-gray-500 mt-1">Generate a clean product interface</div></button><button onclick="quick('Review this code and find the bugs')" class="glass rounded-2xl p-4 hover:bg-white/[.07]"><b class="text-sm">Review code</b><div class="text-xs text-gray-500 mt-1">Debug and improve implementation</div></button><button onclick="quick('Create a launch plan for SparkAgent')" class="glass rounded-2xl p-4 hover:bg-white/[.07]"><b class="text-sm">Plan launch</b><div class="text-xs text-gray-500 mt-1">Turn an idea into actionable steps</div></button></div></div></div><div id="messages" class="max-w-4xl mx-auto space-y-5"></div></section>
<footer class="shrink-0 p-5 md:p-7"><div class="max-w-4xl mx-auto"><div class="glass rounded-3xl p-2 flex items-end gap-2 border-white/10"><textarea id="input" rows="1" onkeydown="key(event)" placeholder="Message your agent…" class="flex-1 resize-none bg-transparent outline-none px-4 py-3 text-sm text-white placeholder:text-gray-600 max-h-40"></textarea><button onclick="send()" class="send w-12 h-12 shrink-0 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-violet-500/20 hover:scale-[1.03] transition">➤</button></div><div class="flex items-center justify-between mt-2 px-2 text-[10px] text-gray-600"><span>Enter to send • Shift+Enter for newline</span><span id="modelLabel">Model: API placeholder</span></div></div></footer>
</main></div>
<script>
const AI_API_KEY='CHANGE_ME_LATER'; // replace when you connect your provider
const AI_BASE_URL='https://openrouter.ai/api/v1/chat/completions';
const agents=[
 {id:'core',icon:'✦',name:'Spark Core',desc:'General purpose agent',model:'openrouter/free',color:'violet',system:'You are Spark Core, a concise and capable general AI assistant.'},
 {id:'code',icon:'⌘',name:'CodeForge',desc:'Coding & debugging agent',model:'openrouter/free',color:'cyan',system:'You are CodeForge, an expert software engineer. Give practical, production-minded code and explain important fixes.'},
 {id:'builder',icon:'◆',name:'Builder',desc:'Apps, UI & product agent',model:'openrouter/free',color:'fuchsia',system:'You are Builder, a product and frontend engineering agent. Design polished interfaces and complete implementation plans.'},
 {id:'research',icon:'◎',name:'Research',desc:'Analysis & planning agent',model:'openrouter/free',color:'amber',system:'You are Research, an analytical assistant. Structure evidence, assumptions, tradeoffs and actionable conclusions. Do not claim live browsing unless provided.'},
 {id:'creative',icon:'✧',name:'Creative',desc:'Ideas, writing & concepts',model:'openrouter/free',color:'pink',system:'You are Creative, an imaginative assistant for concepts, copy, branding and storytelling.'}
];
let active=agents[0],messages=[];
function renderAgents(){document.getElementById('agents').innerHTML=agents.map(a=>`<button onclick="selectAgent('${a.id}')" class="agent ${a.id===active.id?'active':''} w-full text-left rounded-2xl border border-white/7 p-3 flex items-center gap-3"><span class="w-9 h-9 rounded-xl bg-white/5 flex items-center justify-center text-lg">${a.icon}</span><span class="min-w-0"><span class="block text-sm font-semibold truncate">${a.name}</span><span class="block text-[10px] text-gray-500 truncate">${a.desc}</span></span></button>`).join('');document.getElementById('activeName').textContent=active.name;document.getElementById('modelLabel').textContent='Model: '+active.model}
function selectAgent(id){active=agents.find(a=>a.id===id)||active;renderAgents();if(messages.length) addMessage('system',`Switched to **${active.name}** — ${active.desc}.`)}
function newChat(){messages=[];document.getElementById('messages').innerHTML='';document.getElementById('empty').style.display='flex';document.getElementById('input').focus()}
function clearChat(){newChat()}
function quick(t){document.getElementById('input').value=t;send()}
function key(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function addMessage(role,text){document.getElementById('empty').style.display='none';const wrap=document.createElement('div');wrap.className='flex '+(role==='user'?'justify-end':'justify-start');const bubble=document.createElement('div');bubble.className='bubble rounded-3xl px-5 py-4 '+(role==='user'?'user':'ai');if(role==='system')bubble.className+=' text-violet-300 text-xs';bubble.innerHTML=role==='user'?escapeHtml(text):marked.parse(text);wrap.appendChild(bubble);document.getElementById('messages').appendChild(wrap);document.getElementById('chat').scrollTop=999999;return bubble}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function send(){const input=document.getElementById('input');const text=input.value.trim();if(!text)return;input.value='';messages.push({role:'user',content:text});addMessage('user',text);const bubble=addMessage('assistant','<div class="typing"><span></span><span></span><span></span></div>');try{if(AI_API_KEY==='CHANGE_ME_LATER'){await new Promise(r=>setTimeout(r,450));bubble.innerHTML=marked.parse(`**${active.name} is ready.**\n\nYour provider API is still a placeholder. Replace \`AI_API_KEY\` in this file and the agent will send requests to the configured endpoint.\n\n**Task received:** ${text}`);return}const r=await fetch(AI_BASE_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+AI_API_KEY,'HTTP-Referer':location.origin,'X-Title':'SparkAgent'},body:JSON.stringify({model:active.model,messages:[{role:'system',content:active.system},...messages]})});if(!r.ok)throw new Error('API '+r.status);const d=await r.json();const answer=d.choices?.[0]?.message?.content||'No response received.';messages.push({role:'assistant',content:answer});bubble.innerHTML=marked.parse(answer)}catch(e){bubble.innerHTML=marked.parse('⚠️ **Agent connection failed.**\n\n'+e.message+'\n\nCheck your API key, endpoint and model.')}}
renderAgents();
</script></body></html>
